aid: roam
name: Roam
description: 'Roam (withroam.com) is a nationwide assumable-mortgage marketplace that
  helps homebuyers and sellers transact on homes carrying low-rate, legally assumable
  FHA and VA loans. A qualified buyer can take over a seller''s existing mortgage,
  inheriting the original interest rate, remaining balance, and terms, which in a
  6%+ market against sellers'' 2-3% loans can save buyers hundreds of thousands in
  interest. Roam manages the end-to-end assumption process from buyer qualification
  and lender coordination through paperwork and a 45-day close, and offers proprietary
  secondary financing so buyers can put as little as 5% down. It is a proptech company
  backed by Fifth Wall and IVP. Roam publishes no public developer API; this profile
  captures its public web, security, and llms.txt surface.'
